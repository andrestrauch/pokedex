<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pamo´s Pokedex</title>

        <link
            rel="shortcut icon"
            href="./assets/icons/favicon.png"
            type="image/x-icon"
        />

        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./styles/font.css" />
        <link rel="stylesheet" href="style.css" />

        <script src="./scripts/db.js" defer></script>
        <script src="./scripts/templates.js" defer></script>
        <script src="script.js" defer></script>
    </head>
    <body onload="init()">
        <header class="header">
            <section class="header-content">
                <h1>Pamo´s Pokedex</h1>
                <section class="search-section">
                    <input
                        onkeydown="searchStart()"
                        id="searchInput"
                        type="text"
                        placeholder="Search"
                    />
                    <img
                        src="./assets/img/375px-Hauptartwork_921.png"
                        alt="Pamo Img"
                    />
                </section>
            </section>
        </header>

        <main>
            <section class="content">
                <div class="pkmn-container" id="poke">
                    <p class="load-txt">Daten werden geladen...</p>
                </div>
                <div id="loadBtn"></div>
            </section>

            <dialog id="myDialog" class="dialog"></dialog>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2026 Andre Strauch |</p>
                <a href="https://github.com/andrestrauch" target="_blank">
                    GitHub Profil
                </a>
            </div>
        </footer>
    </body>
</html>
